<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d1b2c">
<meta name="apple-mobile-web-app-title" content="Barcelona">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Barcelona guide</title>
<style>
:root{--bg:#f5eee3;--card:#fffaf2;--ink:#1d1b2c;--muted:#6c6677;--line:#e7dccb;--terra:#e0552a;--warn:#9a4a0b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121119;--card:#1c1b28;--ink:#f4ede2;--muted:#a7a1b3;--line:#2f2d40;--terra:#ff7a4d;--warn:#ffb877;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px;box-shadow:0 10px 28px rgba(29,27,44,.1)}
.m{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,#e0552a 0 18px,#127aa6 18px 34px,#f2b01e 34px 50px,#2b9a6b 50px 66px,#d64a6b 66px 82px)}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:700;min-height:48px;border:0;border-radius:12px;background:var(--terra);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="m" aria-hidden="true"></div>
  <h1>Barcelona guide</h1>
  <p>Same password as the trip app.</p>
  <input type="password" id="pw" aria-label="Password" autocomplete="current-password" required>
  <label><input type="checkbox" id="rem" checked> Remember on this phone</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" hidden>Wrong password</p>
</form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.i)}, key, b(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault(); err.hidden = true; go.disabled = true;
  const pw = document.getElementById("pw").value.trim().toLowerCase();
  try {
    const html = await unlock(pw);
    try { if (document.getElementById("rem").checked) localStorage.setItem("trip:pw", pw); else localStorage.removeItem("trip:pw"); } catch(x){}
    show(html);
  } catch(x){ err.hidden = false; go.disabled = false; }
});
(async () => { let saved = null; try { saved = localStorage.getItem("trip:pw"); } catch(x){}
  if (saved){ try { show(await unlock(saved)); } catch(x){} } })();
</script>
