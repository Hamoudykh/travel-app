<head>

<title>Trip</title>
<style>
:root{--bg:#edf2f1;--surface:#fff;--ink:#0f2428;--muted:#55696c;--line:#cbd7d5;--accent:#0a6a7b;--accent-ink:#fff;--warn:#9c4310;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a1517;--surface:#12242a;--ink:#e3eeec;--muted:#93a9a9;--line:#26404a;--accent:#45b8c9;--accent-ink:#04181c;--warn:#f19459;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:1.4rem}
p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
label.rem{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:700;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--warn);font-weight:700;font-size:.92rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <button id="go" type="submit">פתיחה · Open</button>
  <p class="err" id="err" hidden>סיסמה שגויה · Wrong password</p>
</form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.i)}, key, b(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault(); err.hidden = true; go.disabled = true;
  const pw = document.getElementById("pw").value.trim().toLowerCase();
  try {
    const html = await unlock(pw);
    try { if (document.getElementById("rem").checked) localStorage.setItem("trip:pw", pw); else localStorage.removeItem("trip:pw"); } catch(x){}
    show(html);
  } catch(x){ err.hidden = false; go.disabled = false; }
});
(async () => { let saved = null; try { saved = localStorage.getItem("trip:pw"); } catch(x){}
  if (saved){ try { show(await unlock(saved)); } catch(x){ try { localStorage.removeItem("trip:pw"); } catch(y){} } } })();
</script>
